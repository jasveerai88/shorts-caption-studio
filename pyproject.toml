[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shorts-caption-studio"
version = "1.0.0"
description = "Add animated word-by-word captions to YouTube Shorts, TikTok and Reels: burn pop, karaoke or clean highlight captions from your own SRT with ffmpeg, or export the styled .ass file. Free, local, pure Python."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Jasveer Singh" },
]
keywords = [
    "captions",
    "subtitles",
    "shorts",
    "tiktok",
    "reels",
    "srt",
    "ass",
    "ffmpeg",
    "cli",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jasveerai88/shorts-caption-studio"
Repository = "https://github.com/jasveerai88/shorts-caption-studio"
Issues = "https://github.com/jasveerai88/shorts-caption-studio/issues"
Changelog = "https://github.com/jasveerai88/shorts-caption-studio/blob/main/CHANGELOG.md"

[project.scripts]
shorts-caption-studio = "shorts_caption_studio:main"

# The implementation is a single standard-library module in
# src/; it is installed as the top-level module
# `shorts_caption_studio`, and `python3 src/shorts_caption_studio.py`
# keeps working from a checkout. Burn-in shells out to the system
# ffmpeg/ffprobe (external tools, never Python dependencies).
[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["shorts_caption_studio"]
